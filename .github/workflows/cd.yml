name: CD

on:
  push:
    branches: [dev, staging, main]

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: ci
    environment: ${{ github.ref_name }}
    steps:
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "dir=dev" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-api-dev" >> "$GITHUB_OUTPUT"
            echo "env_flag=dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "dir=staging" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-api-staging" >> "$GITHUB_OUTPUT"
            echo "env_flag=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=production" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-api-prod" >> "$GITHUB_OUTPUT"
            echo "env_flag=production" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown branch '${{ github.ref_name }}' — expected 'dev', 'staging', or 'main'"
            exit 1
          fi

      - name: Validate environment file secret
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "dev" ]; then
            ENV_FILE="$DEV_ENV_FILE"
            SECRET_NAME="DEV_ENV_FILE"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_FILE="$STAGING_ENV_FILE"
            SECRET_NAME="STAGING_ENV_FILE"
          elif [ "$BRANCH" = "main" ]; then
            ENV_FILE="$PRODUCTION_ENV_FILE"
            SECRET_NAME="PRODUCTION_ENV_FILE"
          fi
          if [ -z "$ENV_FILE" ]; then
            echo "::error::$SECRET_NAME secret is empty or unset. Add it under Settings → Environments → $BRANCH → Secrets → $SECRET_NAME."
            exit 1
          fi
          echo "$SECRET_NAME is set"
          {
            echo "DOTENV<<__SB_API_DOTENV__"
            echo "$ENV_FILE"
            echo "__SB_API_DOTENV__"
          } >> "$GITHUB_ENV"

      # ── Build on runner ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build
        run: pnpm build

      # ── Transfer artifacts to server ─────────────────────────────────────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync build to server
        env:
          REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DEST: ~/skillbridge/backend/${{ steps.target.outputs.dir }}
        run: |
          ssh "$REMOTE" "mkdir -p ${DEST}/src"
          # compiled app
          rsync -az --delete dist/ "${REMOTE}:${DEST}/dist/"
          # migration source files (typeorm-ts-node-commonjs needs src/database/)
          rsync -az --delete src/database/ "${REMOTE}:${DEST}/src/database/"
          # package manifest and PM2 config
          rsync -az package.json pnpm-lock.yaml ecosystem.config.cjs "${REMOTE}:${DEST}/"

      # ── Server-side: install runtime deps, migrate, restart ──────────────────
      - name: Install, migrate and restart on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOTENV: ${{ env.DOTENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOTENV
          script: |
            set -euo pipefail

            DEPLOY_DIR="$HOME/skillbridge/backend/${{ steps.target.outputs.dir }}"
            APP_NAME="${{ steps.target.outputs.app }}"
            ENV_FLAG="${{ steps.target.outputs.env_flag }}"
            BRANCH="${{ github.ref_name }}"

            cd "$DEPLOY_DIR"

            printf '%s\n' "$DOTENV" > .env
            chmod 600 .env

            pnpm install --frozen-lockfile

            DATABASE_NAME=$(grep -E '^DATABASE_NAME=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_USER=$(grep -E '^DATABASE_USER=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_HOST=$(grep -E '^DATABASE_HOST=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_PORT=$(grep -E '^DATABASE_PORT=' .env | sed 's/^[^=]*=//' | tr -d '\r')
            DATABASE_PASSWORD=$(grep -E '^DATABASE_PASSWORD=' .env | sed 's/^[^=]*=//' | tr -d '\r')

            if [ -z "$DATABASE_NAME" ]; then
              echo "FATAL: DATABASE_NAME is empty in ENV_FILE"
              exit 1
            fi

            DATABASE_NAME_SQL=$(printf '%s' "$DATABASE_NAME" | sed "s/'/''/g")
            if PGPASSWORD="$DATABASE_PASSWORD" psql -h "$DATABASE_HOST" -p "${DATABASE_PORT:-5432}" -U "$DATABASE_USER" -d postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname = '$DATABASE_NAME_SQL'" | grep -q 1; then
              echo "Database $DATABASE_NAME already exists"
            else
              PGPASSWORD="$DATABASE_PASSWORD" createdb -h "$DATABASE_HOST" -p "${DATABASE_PORT:-5432}" -U "$DATABASE_USER" "$DATABASE_NAME"
            fi

            pnpm migration:run

            export PM2_APP_NAME="$APP_NAME"
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 restart ecosystem.config.cjs --only "$APP_NAME" --env "$ENV_FLAG" --update-env
            else
              pm2 start ecosystem.config.cjs --only "$APP_NAME" --env "$ENV_FLAG"
            fi
            pm2 save

            # Push DORA deployment metric to local Pushgateway
            DEPLOY_TS=$(date +%s)
            COUNTER_DIR="$HOME/.skillbridge/deploy-counters"
            mkdir -p "$COUNTER_DIR"
            COUNTER_FILE="$COUNTER_DIR/${APP_NAME}.count"
            COUNT=$(cat "$COUNTER_FILE" 2>/dev/null || echo 0)
            COUNT=$((COUNT + 1))
            echo "$COUNT" > "$COUNTER_FILE"

            printf '# HELP deployment_total Total number of deployments\n# TYPE deployment_total counter\ndeployment_total{environment="%s",status="success",branch="%s",app="%s"} %s\n# HELP deployment_timestamp_seconds Unix timestamp of last deployment\n# TYPE deployment_timestamp_seconds gauge\ndeployment_timestamp_seconds{environment="%s",branch="%s",app="%s"} %s\n' \
              "$ENV_FLAG" "$BRANCH" "$APP_NAME" "$COUNT" \
              "$ENV_FLAG" "$BRANCH" "$APP_NAME" "$DEPLOY_TS" | \
              curl -sf --max-time 5 --data-binary @- \
                "http://localhost:9091/metrics/job/skillbridge_cd/instance/${APP_NAME}" \
              || echo "WARNING: Failed to push DORA metrics to Pushgateway"
