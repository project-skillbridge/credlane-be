<!--
  SkillBridge — Advanced assessment retake available

  Variables:
    {{name}}           recipient first name
    {{dashboardUrl}}   link to the talent dashboard
    {{logoUrl}}        absolute URL or CID (cid:skillbridge-logo) for the white SkillBridge logo
    {{supportEmail}}   support contact address
    {{year}}           copyright year
-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced assessment retake available</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-font-smoothing: antialiased;
      }

      table {
        border-collapse: collapse;
      }

      img {
        border: 0;
        outline: none;
        text-decoration: none;
      }

      a {
        text-decoration: none;
      }
    </style>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #f4f4f5"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="600"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border-radius: 12px;
            "
          >
            <tr>
              <td class="px" style="padding: 32px 40px 0 40px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      bgcolor="#1f5f6b"
                      style="background-color: #1f5f6b; padding: 12px 18px"
                    >
                      <img
                        src="{{logoUrl}}"
                        alt="SkillBridge"
                        width="108"
                        style="display: block; height: auto; border: 0"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="px" style="padding: 24px 40px 0 40px">
                <h1
                  style="
                    margin: 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #18181b;
                  "
                >
                  You can retake your advanced assessment
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 40px 0 40px;
                  font-size: 16px;
                  line-height: 1.5;
                  color: #27272a;
                "
              >
                Hi <strong>{{name}}</strong>,
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 40px 0 40px;
                  font-size: 15px;
                  line-height: 1.5;
                  color: #52525b;
                "
              >
                Your 14-day waiting period has ended. You may start a new
                advanced assessment from your dashboard.
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 40px 32px 40px">
                <a
                  href="{{dashboardUrl}}"
                  style="
                    display: inline-block;
                    padding: 14px 28px;
                    background-color: #1f5f6b;
                    color: #ffffff;
                    font-size: 15px;
                    font-weight: 600;
                    border-radius: 8px;
                  "
                  >Go to dashboard</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 40px 32px 40px;
                  font-size: 13px;
                  line-height: 1.5;
                  color: #a1a1aa;
                "
              >
                Questions? Contact
                <a href="mailto:{{supportEmail}}" style="color: #1f5f6b"
                  >{{supportEmail}}</a
                >.
              </td>
            </tr>
          </table>
          <p style="margin: 24px 0 0 0; font-size: 12px; color: #a1a1aa">
            &copy; {{year}} SkillBridge.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
